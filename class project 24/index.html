<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage the Zoo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
            color: #111;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #0a8f59;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            font-size: 18px;
        }

        #zoo {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px auto;
            max-width: 720px;
        }

        .zone {
            padding: 20px 10px;
            border: 3px solid #333;
            border-radius: 12px;
            text-align: center;
            background: #fff;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .zone h2 {
            margin: 0 0 10px;
            color: #222;
            font-size: 22px;
        }

        .zone p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        button {
            display: block;
            margin: 20px auto;
            background: #0a8f59;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0b6d45;
        }

        #output {
            max-width: 700px;
            margin: 20px auto 0;
            background: #ffffff;
            border: 2px solid #d9d9d9;
            border-radius: 12px;
            padding: 20px;
            line-height: 1.7;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Zoo</h1>
        <p>Use DOM nodes and styles to manage the animal zones.</p>

        <div id="zoo">
            <div id="zone1" class="zone">
                <h2>Lion Zone</h2>
                <p>Lion</p>
            </div>

            <div id="zone2" class="zone">
                <h2>Elephant Zone</h2>
                <p>Elephant</p>
            </div>

            <div id="zone3" class="zone">
                <h2>Panda Zone</h2>
                <p>Panda</p>
            </div>
        </div>

        <button id="manageZooBtn" type="button">Manage Zoo</button>
        <div id="output">Zoo is ready.</div>
    </div>

    <script>
        const button = document.getElementById('manageZooBtn');

        button.addEventListener('click', () => {
            const zoo = document.getElementById('zoo');
            const zone1 = document.getElementById('zone1');
            const zone2 = document.getElementById('zone2');
            const zone3 = document.getElementById('zone3');
            const output = document.getElementById('output');

            const parentOfZoo = zoo.parentNode;
            const parentOfZone1 = zone1.parentNode;
            const childNodesOfZone2 = zone2.childNodes;
            const nextZone = zone1.nextElementSibling;
            const previousZone = zone3.previousElementSibling;

            zone1.querySelector('h2').innerHTML = 'Lion Zone';
            zone2.querySelector('h2').innerHTML = 'Elephant Zone';
            zone3.querySelector('h2').innerHTML = 'Panda Zone';

            zone1.style.backgroundColor = '#ffd166';
            zone2.style.backgroundColor = '#9ad0c2';
            zone3.style.backgroundColor = '#cfe8ff';

            const nodeTypeZone1 = zone1.nodeType === 1 ? 'Element node' : 'Text node';
            const nodeTypeText = zone1.firstChild.nodeType === 3 ? 'Text node' : 'Element node';

            output.innerHTML =
                'Zoo parent: ' + parentOfZoo.nodeName + '<br>' +
                'Zone 1 parent: ' + parentOfZone1.nodeName + '<br>' +
                'Zone 2 child nodes: ' + childNodesOfZone2.length + '<br>' +
                'Next sibling of zone1: ' + nextZone.id + '<br>' +
                'Previous sibling of zone3: ' + previousZone.id + '<br>' +
                'Zone 1 node type: ' + nodeTypeZone1 + '<br>' +
                'First child of zone1 node type: ' + nodeTypeText;
        });
    </script>
</body>
</html>
