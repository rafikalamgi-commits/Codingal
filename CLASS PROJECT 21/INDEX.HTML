<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H2>METHODS AND LOOPS</H2>
    <P>NUMBERS FROM 1 TO 10;</P>
    <P id="numbers"></P>
    <p id="random"></p>
    <p id="day"></p>
</body>
<script>
    
    // Display numbers from 1 to 10
    let numbers = "";
    for (let i = 1; i <= 10; i++) {
        numbers += i + " ";
    }
    document.getElementById("numbers").innerText = numbers;

    // Generate a random number between 1 and 100
    let randomNum = Math.floor(Math.random() * 100) + 1;
    document.getElementById("random").innerText = "Random Number: " + randomNum;

    // Display the current day of the week
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const today = new Date();
    const dayName = days[today.getDay()];
    document.getElementById("day").innerText = "Today is: " + dayName;
</script>
</html>
