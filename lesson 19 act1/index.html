<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript Syntax and Comments</title>
</head>
<body>
    <h1 id="myh"></h1>
    <p id="myp"></p>

    </script>
