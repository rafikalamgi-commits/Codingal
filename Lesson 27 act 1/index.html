<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Sorter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(to right, #a319da, #1ee4e4);
        }

        h1, h3 {
            color: rgb(60, 211, 0);
        }

        .box {
            background: white;
            color: rgb(83, 216, 6);
        }

        .btn-primary {
            background-color: linear-gradient(to left   , #40da19, #1ee4e4);
            border-color: linear-gradient(to bottom, #19dab0, #531ee4);
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">Sort your favorite songs and play counts</p>
    </div>

    <div class="container">
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Play Counts</h3>
                <button class="btn btn-primary" onclick="sortLeast()">Least Played First</button>
                <button class="btn btn-primary" onclick="sortMost()">Most Played First</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Play Count</h3>
                <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
    </div>

    <script>
        var songs = ["pal pal,", "dil", "dhadkan", "tum hi ho", "channa mereya"];
        var plays = [320, 85, 210, 50, 175];

        document.getElementById('nameResult').innerHTML = 'Songs: ' + songs;
        document.getElementById('countResult').innerHTML = 'Plays: ' + plays;
        document.getElementById('labelResult').innerHTML = 'Press the button above!';

        function sortAZ() {
            songs.sort();
            document.getElementById('nameResult').innerHTML = 'Songs: ' + songs;
        }

        function sortZA() {
            songs.sort();
            songs.reverse();
            document.getElementById('nameResult').innerHTML = 'Songs: ' + songs;
        }

        function sortLeast() {
            plays.sort(function(a, b) {
                return a - b;
            });
            document.getElementById('countResult').innerHTML = 'Plays: ' + plays;
        }

        function sortMost() {
            plays.sort(function(a, b) {
                return b - a;
            });
            document.getElementById('countResult').innerHTML = 'Plays: ' + plays;
        }

        function addLabel() {
            document.getElementById('labelResult').innerHTML = songs.map(function(song, index) {
                return song + ': ' + plays[index] + ' plays';
            }).join('<br>');
        }
    </script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
