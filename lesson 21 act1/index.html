<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript string methods</title>
</head>
<body>
    <h2>javascript string methods</h2>
    <p> Basic string methods in JavaScript</p>
</body>
<script>
    str = "AmAzInG"

    document.write(str.toLowerCase());
    document.write("<br>");
    document.write(str.toUpperCase());
    document.write("<br>");
    document.write(str.startsWith("i"));
    document.write("<br>");

    str1 = "i am learn about methods";
    pattern = new RegExp("about");
    res = pattern.test(str1);
    document.write(res);
</script>
