<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Phone Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <h1>My Phone Contact</h1>
        <p class="text-muted">A few details about my contact.</p>

        <div class="card mb-4" style="max-width: 32rem;">
            <div class="card-body">
                <h2 class="card-title h4" style="color:orange">Contact Details</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Name: <span id="name"></span></li>
                    <li class="list-group-item">Phone: <span id="phone"></span></li>
                    <li class="list-group-item">School: <span id="school"></span></li>
                    <li class="list-group-item">City: <span id="city"></span></li>
                </ul>
            </div>
        </div>
        </div>
        </div>
    </main>

    <script>
        var myContact = {
            name: "Reyan",
            phone: "87000-98944",
            school: "Codingal School",
            city: "Raxaul"
        };

        document.getElementById("name").textContent = myContact.name;
        document.getElementById("phone").textContent = myContact.phone;
        document.getElementById("school").textContent = myContact["school"];
        document.getElementById("city").textContent = myContact["city"];
    </script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
</body>
</html>
