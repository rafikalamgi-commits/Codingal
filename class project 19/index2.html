<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 style="color: rgb(182, 36, 31);">JavaScript Statements</h2>
    <p style="color: aqua;"><b>JavaScript statements are instructions to be executed by the web browser.</b></p>
    <p id="demo"></p>
    <script>
        var x,y,z;
        x = 5;
        y = 6;
        z = x + y;
        document.getElementById("demo").innerHTML = "The value of z is: " + z + ".";
    </script>
</body>
</html>
