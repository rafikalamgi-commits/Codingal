<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Countdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            margin: 0;
            padding: 30px;
            color: #111;
        }

        h1 {
            color: #8e2b8d;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .panel {
            max-width: 1100px;
            margin: 0 auto;
        }

        .box {
            background: #f6f6f6;
            border: 2px solid #d7d7d7;
            border-radius: 12px;
            padding: 18px 14px;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 30px;
            max-width: 700px;
        }

        button {
            grid-column: 1 / -1;
            width: 220px;
            justify-self: center;
            background: #8e2b8d;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #6d1d73;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Instructions</h1>

        <div class="grid">
            <div id="missing" class="box">Missing Details</div>
            <div id="greeting" class="box">Greeting</div>
            <div id="daysLeft" class="box">Days Left</div>
            <div id="countdown" class="box">Countdown</div>

            <button id="checkButton" type="button">Check Countdown</button>
        </div>
    </div>

    <script>
        const button = document.getElementById('checkButton');

        button.addEventListener('click', () => {
            let giftIdea = null;
            let cakeFlavor;
            document.getElementById('missing').innerHTML = giftIdea + '<br>' + cakeFlavor;

            const hour = new Date().getHours();
            let greetingText = '';

            if (hour < 12) {
                greetingText = 'Good morning ' + 'Sam';
            } else if (hour < 17) {
                greetingText = 'Good afternoon ' + 'Sam';
            } else {
                greetingText = 'Good evening ' + 'Sam';
            }

            document.getElementById('greeting').innerHTML = greetingText;

            let daysLeft = 3;
            let message = '';

            if (daysLeft == 0) {
                message = 'Today is the party!';
            } else if (daysLeft == 1) {
                message = 'Tomorrow is the party!';
            } else {
                message = daysLeft + ' days to go until the party!';
            }

            document.getElementById('daysLeft').innerHTML = message;

            let day = daysLeft;
            let countdownText = '';

            while (day >= 1) {
                countdownText += 'Days left: ' + day + '<br>';
                day--;
            }

            countdownText += 'Party time!';
            document.getElementById('countdown').innerHTML = countdownText;
        });
    </script>
</body>
</html>
