<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Restaurant Menu card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Menu-card">
        <h1 class="RestaurantName">Pizza Arts</h1>
    </div>
    <div class="tagline">
        <p>Where every slice is a masterpiece!</p>
    </div>
    <div id="Menu">
        <h2>Food Menu</h2>
    </div>
        <div class="product-container">
            <!-- Aapki Image -->
            <img src="images.jpg" alt="Saman ki photo" class="product-image">
        
            <!-- Arrow aur Details -->
            <div class="product-details">
                <h3 class="product-name">Noodle</h3>
                <span class="product-price">₹2,499</span>
            </div>
        </div>
        <div class="product-container">
            <!-- Aapki Image -->
            <img src="images (1).jpg" alt="Saman ki photo" class="product-image">
        
            <!-- Arrow aur Details -->
            <div class="product-details">
                <h3 class="product-name">pizza</h3>
                <span class="product-price">₹2,499</span>
            </div>
        </div>
        </body>
</body>
</html>
