<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #dfe7e7;
    background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    color: #2f2f2f;
}

body {
    padding: 24px 18px;
}

.dot.red {
    background: #f26c5c;
}

.dot.yellow {
    background: #f0c14b;
}

.dot.green {
    background: #3fbf67;
}

.toolbar {
    display: flex;
    gap: 8px;
}

.toolbar span {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 4px;
    background: #d0d0d0;
}

.app-body {
    background: #f3f2ee;
    padding: 16px 18px 22px;
}

.app-body h2 {
    text-align: center;
    color: #eb7a49;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 16px;
}

.hobby-row {
    margin: 0 auto;
    max-width: 460px;
}

.hobby-card {
    text-align: center;
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    border-radius: 8px 8px 4px 4px;
    border: 2px solid rgba(0, 0, 0, 0.08);
    box-shadow: inset 0 -8px 12px rgba(0, 0, 0, 0.05);
    padding: 12px;
}

.hobby-card.drawing {
    background: linear-gradient(180deg, #f7b767, #ef9d43);
}

.hobby-card.football {
    background: linear-gradient(180deg, #f8cf60, #f0b72b);
}

.hobby-card.reading {
    background: linear-gradient(180deg, #7ea4ff, #4f7ce7);
}

@media (max-width: 980px) {
    .page-shell {
        flex-direction: column;
    }

    .preview-panel {
        width: 100%;
        max-width: 760px;
        flex-basis: auto;
    }
}

    </style>
</head>
<body>
    <div class="app-body">
        <h2>My Hobby Cards</h2>
        <div class="container">
            <div class="row hobby-row">
                <div class="col-sm-4">
                    <div class="hobby-card drawing">Drawing</div>
                            </div>
                            <div class="col-sm-4">
                                <div class="hobby-card football">Football</div>
                            </div>
                            <div class="col-sm-4">
                                <div class="hobby-card reading">Reading</div>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
